[package]
name = "slugsocial-server"
version = "0.0.1"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["query"] }
bytes = "1.11.1"  # pin: RUSTSEC-2026-0007
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3.47", features = ["formatting"] }
maud = "0.26"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
slug-types = { path = "../types" }
base64 = "0.22"
postcard = { version = "1", features = ["use-std"] }

[dev-dependencies]
tempfile = "3"
http = "1"
quinn-proto = "0.11.14"  # pin: RUSTSEC-2026-0008


