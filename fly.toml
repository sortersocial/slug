app = "slugsocial"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SLUG_DATA_DIR = "/data"
  SLUG_EVENT_LOG = "/data/events.jsonl"
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    # The server replays the whole event log before it binds the port, so the
    # socket is closed for the entire boot. Grace must exceed worst-case replay
    # (~35s on a 2.6k-ingest log, and replay grows faster than the log does).
    grace_period = "120s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    tls_skip_verify = false

[[mounts]]
  source = "slugsocial_data"
  destination = "/data"

