name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: build slugsocial binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            plat: darwin
            arch: arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            plat: darwin
            arch: x64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust CLI
        run: cargo build --release -p slugsocial --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/slugsocial${{ matrix.ext }}" "dist/slugsocial-${{ matrix.plat }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: slugsocial-${{ matrix.plat }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: publish npm
    needs: build-binaries
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Copy binaries into npm platform packages
        shell: bash
        run: |
          set -euxo pipefail
          for dir in artifacts/*; do
            name="$(basename "$dir")"
            # name is slugsocial-<plat>-<arch>
            plat="$(echo "$name" | cut -d- -f2)"
            arch="$(echo "$name" | cut -d- -f3)"
            pkg="packages/npm/platforms/${plat}-${arch}"
            mkdir -p "$pkg/bin"
            # Find the binary file
            bin="$(ls "$dir"/slugsocial-* | head -1)"
            cp "$bin" "$pkg/bin/slugsocial"
            chmod +x "$pkg/bin/slugsocial"
          done

      - name: Set npm package versions from tag
        shell: bash
        run: |
          set -euxo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION"

          # Root package
          node -e "const fs=require('fs'); const p='packages/npm/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=process.env.VERSION; for (const k of Object.keys(j.optionalDependencies||{})) j.optionalDependencies[k]=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');"

          # Platform packages
          for pkg in packages/npm/platforms/*; do
            node -e "const fs=require('fs'); const p=process.argv[1]+'/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');" "$pkg"
          done

      - name: Publish npm platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euxo pipefail
          for pkg in packages/npm/platforms/*; do
            (cd "$pkg" && npm publish --access public)
          done

      - name: Publish npm root package
        shell: bash
        run: |
          set -euxo pipefail
          cd packages/npm
          # Publish unscoped `slugsocial` via npm Trusted Publishing (OIDC).
          # Ensure we *do not* use NODE_AUTH_TOKEN auth for this step; trusted publishing uses OIDC.
          export NPM_CONFIG_USERCONFIG="$(mktemp)"
          unset NODE_AUTH_TOKEN || true
          npm config set registry "https://registry.npmjs.org/"
          npm publish --access public --provenance


