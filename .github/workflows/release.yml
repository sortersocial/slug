name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: build slugsocial binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            plat: darwin
            arch: arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            plat: darwin
            arch: x64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            plat: linux
            arch: x64
            ext: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            plat: linux
            arch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: matrix.plat == 'linux'
        run: sudo apt-get install -y musl-tools

      - name: Build Rust CLI
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            export SLUG_VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch on a branch, or unexpected ref
            export SLUG_VERSION="0.0.0-dev"
          fi
          echo "SLUG_VERSION=${SLUG_VERSION}"
          cargo build --release -p slugsocial --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/slugsocial${{ matrix.ext }}" "dist/slugsocial-${{ matrix.plat }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: slugsocial-${{ matrix.plat }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: publish npm
    needs: build-binaries
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@latest

      - name: Copy binaries into npm platform packages
        shell: bash
        run: |
          set -euxo pipefail
          for dir in artifacts/*; do
            name="$(basename "$dir")"
            # name is slugsocial-<plat>-<arch>
            plat="$(echo "$name" | cut -d- -f2)"
            arch="$(echo "$name" | cut -d- -f3)"
            pkg="packages/npm/platforms/${plat}-${arch}"
            mkdir -p "$pkg/bin"
            # Find the binary file
            bin="$(ls "$dir"/slugsocial-* | head -1)"
            cp "$bin" "$pkg/bin/slugsocial"
            chmod +x "$pkg/bin/slugsocial"
          done

      - name: Set npm package versions from tag
        shell: bash
        run: |
          set -euxo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION"

          # Root package
          node -e "const fs=require('fs'); const p='packages/npm/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=process.env.VERSION; for (const k of Object.keys(j.optionalDependencies||{})) j.optionalDependencies[k]=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');"

          # Platform packages
          for pkg in packages/npm/platforms/*; do
            node -e "const fs=require('fs'); const p=process.argv[1]+'/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');" "$pkg"
          done

      - name: Publish npm platform packages
        shell: bash
        run: |
          set -euxo pipefail
          for pkg in packages/npm/platforms/*; do
            (cd "$pkg" && npm publish --access public)
          done

      - name: Publish npm root package
        shell: bash
        run: |
          set -euxo pipefail
          cd packages/npm
          npm publish --access public

  publish-pypi:
    name: publish PyPI
    needs: build-binaries
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build wheel

      - name: Build platform wheels
        shell: bash
        run: |
          set -euxo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"

          # Map artifact name (slugsocial-<plat>-<arch>) → PyPI platform tag
          declare -A PLAT_TAGS=(
            ["darwin-arm64"]="macosx_11_0_arm64"
            ["darwin-x64"]="macosx_10_9_x86_64"
            ["linux-x64"]="manylinux_2_17_x86_64"
            ["linux-arm64"]="manylinux_2_17_aarch64"
          )

          # Update version in pyproject.toml from git tag
          sed -i "s/^version = .*/version = \"${VERSION}\"/" packages/pypi/pyproject.toml

          mkdir -p packages/pypi/dist

          for dir in artifacts/*; do
            name="$(basename "$dir")"
            # Artifact dirs are named slugsocial-<plat>-<arch>
            plat="$(echo "$name" | cut -d- -f2)"
            arch="$(echo "$name" | cut -d- -f3)"
            plat_tag="${PLAT_TAGS[${plat}-${arch}]}"

            # Copy the Rust binary into the package
            mkdir -p packages/pypi/slugsocial/bin
            bin_src="$(ls "$dir"/slugsocial-* | head -1)"
            cp "$bin_src" packages/pypi/slugsocial/bin/slugsocial
            chmod +x packages/pypi/slugsocial/bin/slugsocial

            # Build the wheel (produces py3-none-any.whl) into a temp dir
            tmpdir="$(mktemp -d)"
            python -m build --wheel --outdir "$tmpdir" packages/pypi

            # Retag the wheel with the correct platform tag; --remove drops the original
            python -m wheel tags \
              --remove \
              --python-tag py3 \
              --abi-tag none \
              --platform-tag "${plat_tag}" \
              "$tmpdir"/slugsocial-*.whl

            # Move the retagged wheel to the shared dist dir
            mv "$tmpdir"/slugsocial-*.whl packages/pypi/dist/
            rm -rf "$tmpdir"

            # Clean binary for the next iteration
            rm packages/pypi/slugsocial/bin/slugsocial
          done

      - name: Publish to PyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypi/dist/


